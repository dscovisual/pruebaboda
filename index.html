<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>
    <!-- Usamos una fuente elegante para los detalles -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor-principal">
        
        <!-- Instrucción para el usuario -->
        <p class="instruccion" id="texto-instruccion">Toca el sobre para abrir</p>

        <!-- Contenedor del sobre -->
        <div class="sobre-wrapper" id="sobre">
            
            <!-- La parte trasera del sobre -->
            <div class="sobre-fondo"></div>
            
            <!-- La Carta / Invitación que diseñes en GIMP va acá -->
            <div class="carta">
                <!-- Reemplazá el src con la imagen exportada de GIMP -->
                <img src="img/Sin nombre.png" alt="Nuestra Boda" class="imagen-invitacion">
                
                <!-- Botones que aparecen al salir la carta -->
                <div class="botones-accion">
                    <a href="https://wa.me/5493880000000?text=Hola!%20Confirmo%20mi%20asistencia%20a%20la%20boda" target="_blank" class="btn btn-confirmar">Confirmar Asistencia</a>
                    <a href="https://maps.google.com/?q=Salon+Elegante+Jujuy" target="_blank" class="btn btn-mapa">Ver Ubicación</a>
                </div>
            </div>

            <!-- Solapa superior (la que se abre) -->
            <div class="solapa"></div>
            
            <!-- Bolsillo frontal del sobre -->
            <div class="bolsillo"></div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
