<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Los pétalos se generan dinámicamente desde script.js -->
    <div class="petalos" id="petalos" aria-hidden="true"></div>

    <main class="contenedor-principal">

        <div class="encabezado">
            <p class="eyebrow" id="eyebrow">Nos casamos</p>
            <p class="instruccion" id="texto-instruccion">Toca el sobre para descubrir la invitación</p>
        </div>

        <div class="sobre-wrapper" id="sobre">

            <div class="sobre-fondo"></div>

            <div class="carta">

                <img src="img/Sin nombre.png" alt="Nuestra Boda" class="imagen-invitacion">

                <div class="divisor">
                    <span>&#10022;</span>
                </div>

                <div class="botones-accion">
                    <a href="https://wa.me/5493880000000?text=Hola!%20Confirmo%20mi%20asistencia%20a%20la%20boda" target="_blank" class="btn btn-confirmar">Confirmar Asistencia</a>
                    <a href="https://maps.google.com/?q=Salon+Elegante+Jujuy" target="_blank" class="btn btn-mapa">Ver Ubicación</a>
                </div>

                <div class="lista-invitados">
                    <p class="lista-titulo">Sumate a la lista de invitados</p>
                    <p class="lista-subtitulo">Escribí tu nombre y te confirmamos por WhatsApp</p>

                    <div class="lista-form">
                        <input
                            type="text"
                            id="nombre-invitado"
                            class="input-nombre"
                            placeholder="Tu nombre completo"
                            autocomplete="name"
                        >
                        <button type="button" id="btn-enviar-lista" class="btn-whatsapp-lista">
                            <svg viewBox="0 0 24 24" class="icono-whatsapp" aria-hidden="true">
                                <path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.01a7.94 7.94 0 0 0 5.54-13.58ZM12.06 18.4h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.65.67-2.44-.16-.25a6.58 6.58 0 0 1 10.2-8.2 6.53 6.53 0 0 1 1.94 4.66 6.6 6.6 0 0 1-6.54 6.64Zm3.6-4.93c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.44.1-.13.19-.5.64-.62.78-.11.13-.23.15-.42.05-.2-.1-.83-.31-1.58-.98-.58-.52-.98-1.16-1.09-1.36-.11-.2-.01-.3.09-.4.09-.09.2-.23.3-.35.1-.11.13-.19.2-.32.07-.13.03-.25-.02-.35-.05-.1-.44-1.06-.6-1.45-.16-.38-.32-.33-.44-.34h-.38c-.13 0-.34.05-.52.24-.18.19-.68.66-.68 1.62 0 .95.7 1.87.79 2 .1.13 1.37 2.1 3.33 2.94.46.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94.17-.46.17-.85.12-.94-.05-.08-.18-.13-.38-.23Z"/>
                            </svg>
                            Enviar confirmación
                        </button>
                    </div>
                    <p class="lista-nota" id="lista-nota"></p>
                </div>

            </div>

            <div class="solapa">
                <div class="sello">
                    <span>M&amp;F</span>
                </div>
            </div>

            <div class="bolsillo"></div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
